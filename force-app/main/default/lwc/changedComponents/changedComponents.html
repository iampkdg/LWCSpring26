<template>
  <lightning-card title="Changed Lightning Web Components – Demos (One Page)">
    <div class="slds-p-around_medium">

      <!-- =========================================================
           1) lightning-combobox
           Change: Now participates correctly in validation + form submission
           ========================================================= -->
      <section class="demo">
        <h2 class="slds-text-heading_small">1 lightning-combobox  validation + form submit</h2>

        <form onsubmit={handleComboboxSubmit}>
          <lightning-combobox
            name="country"
            label="Country (required)"
            placeholder="Pick one"
            value={comboValue}
            options={comboOptions}
            required
            onchange={handleComboboxChange}>
          </lightning-combobox>

          <div class="slds-m-top_small">
            <lightning-button type="submit" variant="brand" label="Submit form"></lightning-button>
          </div>
        </form>
      </section>

      <hr class="slds-m-vertical_medium" />

      <!-- =========================================================
           2) lightning-datatable accessibility (read-only lock icon)
           Change: With displayReadOnlyIcon:true + editable:false,
                   lock icon now inside <span aria-label="Locked Column Name" role="image">...
                   Assistive text span removed.
           Demo: locked column + displayReadOnlyIcon
           ========================================================= -->
      <section class="demo">
        <h2 class="slds-text-heading_small">2 lightning-datatable  locked column icon a11y</h2>

        <lightning-datatable
          key-field="id"
          data={lockedData}
          columns={lockedColumns}>
        </lightning-datatable>

        <p class="slds-m-top_x-small slds-text-color_weak">
          Inspect the lock icon markup in DevTools to see updated aria-label/role behavior.
        </p>
      </section>

      <hr class="slds-m-vertical_medium" />


      <!-- =========================================================
           3) lightning-input required types
           Change: Required fields of type checkbox/date/datetime/time/file => <abbr aria-hidden="true">
          
           ========================================================= -->
      <section class="demo">
        <h2 class="slds-text-heading_small">3 lightning-input required types a11y</h2>

        <lightning-input type="checkbox" label="Required checkbox" required></lightning-input>

        <lightning-input class="slds-m-top_small" type="time" label="Required time" required></lightning-input>

        <lightning-input class="slds-m-top_small" type="file" label="Required file" required></lightning-input>

        <p class="slds-m-top_x-small slds-text-color_weak">
          Inspect required indicator markup (<code>&lt;abbr&gt;</code>) for aria-hidden behavior.
        </p>
      </section>

      <hr class="slds-m-vertical_medium" />


      <!-- =========================================================
           4) lightning-input-rich-text
           Change: default font size now 13
           ========================================================= -->
      <section class="demo">
        <h2 class="slds-text-heading_small">4 lightning-input-rich-text default font size</h2>

        <lightning-input-rich-text value={rtValue} onchange={handleRichTextChange}></lightning-input-rich-text>

        <p class="slds-m-top_small">Value (HTML):</p>
        <pre class="codebox">{rtValue}</pre>
      </section>

      <hr class="slds-m-vertical_medium" />

      <!-- =========================================================
           5) lightning-radio-group
           Change: role="status" container with empty div on load;
                   on field-level error renders <span> assistive text with field label
           Demo: required radio group + manual reportValidity()
           ========================================================= -->
      <section class="demo">
        <h2 class="slds-text-heading_small">5 lightning-radio-group field error a11y</h2>

        <lightning-radio-group
          name="rg"
          label="Pick one (required)"
          options={rgOptions}
          value={rgValue}
          required
          onchange={handleRadioChange}>
        </lightning-radio-group>

        <div class="slds-m-top_small">
          <lightning-button label="Validate" variant="brand" onclick={validateRadio}></lightning-button>
        </div>
      </section>

      <hr class="slds-m-vertical_medium" />

      <!-- =========================================================
           6) lightning-select
           Change: role="status" now contains empty div on load;
                   on field-level error renders <span> assistive text with field label
           Demo: required select + reportValidity()
           ========================================================= -->
      <section class="demo">
        <h2 class="slds-text-heading_small">6 lightning-select field error a11y</h2>

        <lightning-select label="Choose (required)" required value={selValue} onchange={handleSelectChange}>
          <option value="">-- none --</option>
          <option value="1">One</option>
          <option value="2">Two</option>
        </lightning-select>

        <div class="slds-m-top_small">
          <lightning-button label="Validate" variant="brand" onclick={validateSelect}></lightning-button>
        </div>
      </section>

      <hr class="slds-m-vertical_medium" />

      <!-- =========================================================
           7) lightning-tree
           Change: chevron icon uses bare variant and displays in blue
           Demo: simple tree
           ========================================================= -->
      <section class="demo">
        <h2 class="slds-text-heading_small">7 lightning-tree chevron styling</h2>

        <lightning-tree items={treeItems} header="Folders"></lightning-tree>

        <p class="slds-m-top_x-small slds-text-color_weak">
          The chevron styling is internal; just visually confirm it.
        </p>
      </section>

      <hr class="slds-m-vertical_medium" />

      <!-- =========================================================
           8) lightning-tree-grid
           Change: After Right Arrow expands a row, next Right Arrow focuses checkbox column (if not hidden)
           Demo: tree grid + toggle hide-checkbox-column
           How to test:
             1) Use keyboard to focus a row
             2) Press Right Arrow to expand
             3) Press Right Arrow again => focus should move to checkbox column (if visible)
           ========================================================= -->
      <section class="demo">
        <h2 class="slds-text-heading_small">8 lightning-tree-grid  keyboard focus after expand</h2>

        <div
        class="treeGridWrapper"
        tabindex="0"
        role="group"
        aria-label="Tree grid container"
        onfocus={handleTreeGridWrapperFocus}>

        <lightning-tree-grid
            class="treeGrid"
            columns={tgColumns}
            data={tgData}
            key-field="name"
            hide-checkbox-column={tgHideCheckbox}
            aria-label="Job hierarchy tree grid">
        </lightning-tree-grid>
    </div>

    <div class="slds-m-top_small">
        <lightning-input
            type="toggle"
            label="Hide checkbox column"
            checked={tgHideCheckbox}
            onchange={toggleTreeGridCheckbox}>
        </lightning-input>
    </div>
      </section>

    </div>
  </lightning-card>
</template>
